<text x="808.0" y="452" font-size="10.5" fill="#9AAEC0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">10 cm</text>
<line x1="916.0" y1="430" x2="916.0" y2="438" stroke="#5F7488"/>
<text x="916.0" y="452" font-size="10.5" fill="#9AAEC0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">1 m</text>
<line x1="1024.0" y1="430" x2="1024.0" y2="438" stroke="#5F7488"/>
<text x="1024.0" y="452" font-size="10.5" fill="#9AAEC0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">10 m</text>
<line x1="1132.0" y1="430" x2="1132.0" y2="438" stroke="#5F7488"/>
<text x="1132.0" y="452" font-size="10.5" fill="#9AAEC0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">100 m</text>
<text x="40" y="494" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">σZ = Z² / (f · B) · σd   —   error grows with the square of distance and falls with the baseline. Video gives redundancy, not viewpoint diversity.</text>
