<rect x="913.6" y="150" width="65.2" height="40" rx="5" fill="#1A7A96" fill-opacity="0.9"/>
<text x="921.6000000000001" y="175" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="start">Export</text>
<text x="921.6000000000001" y="210" font-size="11" fill="#9AAEC0" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">~1 min 00 s</text>
<text x="40" y="250" font-size="11.5" fill="#9AAEC0" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">Short stages: SuperPoint ~15 s · SegFormer ~15 s · Depth Anything V2 ~20 s · scale alignment ~10 s</text>
