<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AAEC0"/></marker>
<marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3FB3CF"/></marker>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#FF7A66" fill-opacity="0.18"/><line x1="0" y1="0" x2="0" y2="9" stroke="#FF7A66" stroke-width="3" stroke-opacity="0.55"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="330" rx="18" fill="#0B1B2B"/>
<text x="40" y="46" font-size="12" fill="#3FB3CF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="3">TIMING BUDGET</text>
<text x="40" y="78" font-size="23" fill="#E6EEF5" font-weight="600" text-anchor="start">&lt; 15 minutes for a 10-minute flight — design estimate on a decent GPU</text>
