<text x="232.80000000000004" y="210" font-size="11" fill="#9AAEC0" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">~5 min 30 s</text>
