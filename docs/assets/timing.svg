<rect x="644.8" y="150" width="98.8" height="40" rx="5" fill="#1A7A96" fill-opacity="0.9"/>
<text x="652.8000000000001" y="175" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="start">TSDF fusion</text>
<text x="652.8000000000001" y="210" font-size="11" fill="#9AAEC0" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">~1 min 30 s</text>
<rect x="745.6" y="150" width="166.0" height="40" rx="5" fill="#3FB3CF" fill-opacity="0.7"/>
