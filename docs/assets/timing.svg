<text x="1054.0" y="128" font-size="11.5" fill="#FF6470" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">900 s budget</text>
<text x="40" y="132" font-size="12" fill="#E6EEF5" font-weight="600" text-anchor="start">≈ 14 min total, sequential</text>
