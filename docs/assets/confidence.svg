<text x="804" y="150" font-size="17" fill="#E6EEF5" font-weight="600" text-anchor="start">Measured</text>
<text x="804" y="174" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">Seen from two or more viewpoints with a</text>
<text x="804" y="192" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">good triangulation angle. The ≤ 1 m claim</text>
<text x="804" y="210" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">applies here.</text>
<rect x="760" y="242" width="28" height="28" rx="6" fill="url(#hatch)" stroke="#FF7A66" stroke-width="1.5"/>
<text x="804" y="262" font-size="17" fill="#E6EEF5" font-weight="600" text-anchor="start">Inferred</text>
<text x="804" y="286" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">AI depth with no geometric backing, or walls</text>
<text x="804" y="304" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">extruded from the roof outline. Plausible,</text>
<text x="804" y="322" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">unverified — measurements across it warn.</text>
<rect x="760" y="354" width="28" height="28" rx="6" fill="#6B7785" stroke="#6B7785" stroke-width="1.5"/>
<text x="804" y="374" font-size="17" fill="#E6EEF5" font-weight="600" text-anchor="start">External</text>
<text x="804" y="398" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">Base terrain (SRTM / Cesium World Terrain).</text>
<text x="804" y="416" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">5–16 m vertical, historical — context only,</text>
<text x="804" y="434" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">never blended into the reconstruction.</text>
<text x="40" y="476" font-size="12.5" fill="#9AAEC0" font-weight="400" text-anchor="start">Confidence per voxel = views that saw it × max triangulation angle × source (triangulated vs prior). It drives measurement error bars, the coverage-gap map and the re-fly advisor.</text>
